<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#000;color:#fff}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}html,body{height:100%;overflow:hidden}</style></head><body>
<title>SLAB FIELD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap">
<style>
:root {
  --concrete: #000;
  --slab: #0a0a0a;
  --paper: #0a0a0a;
  --ink: #fff;
  --acid: #c0fe04;
  --mut: #6f6f6f;
  --hair: rgba(255,255,255,.16);
  --signal: var(--acid);
  --display: 'Anton', Impact, 'Arial Black', sans-serif;
  --mono: 'Space Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --frame: 2px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--concrete);
  color: var(--ink);
  font-family: var(--mono);
  font-weight: 500;
  font-size: 13px;
  line-height: 1.35;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.app {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  border: var(--frame) solid var(--hair);
  background: var(--slab);
  min-width: 0;
}
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 4px 16px;
  padding: 10px 14px 8px;
  background: var(--paper);
  border-bottom: var(--frame) solid var(--hair);
  min-width: 0;
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(1.5rem, 6vw, 2.9rem);
  line-height: 0.9;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  text-wrap: balance;
  color: var(--acid);
}
h1 span { color: var(--ink); }
.spec {
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 11px;
  font-weight: 700;
  text-align: right;
  color: var(--mut);
}
.hazard {
  height: 8px;
  background: repeating-linear-gradient(-45deg, var(--acid) 0 12px, #000 12px 24px);
  border-bottom: var(--frame) solid var(--hair);
}
.stage {
  position: relative;
  min-height: 0;
  background: #000;
  overflow: hidden;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  touch-action: none;
  cursor: crosshair;
  user-select: none;
  -webkit-user-select: none;
}
.tag {
  position: absolute;
  margin: 0;
  padding: 5px 8px;
  background: #000;
  color: var(--acid);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.tag b { color: #000; font-weight: 700; background: var(--acid); padding: 0 4px; }
.tl { top: 8px; left: 8px; }
.bl { bottom: 8px; left: 8px; background: var(--acid); color: #000; }
.br { bottom: 8px; right: 8px; text-align: right; display: grid; gap: 1px; }
.nogl {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  padding: 24px;
  background: var(--acid);
  color: #000;
  font-family: var(--display);
  font-size: clamp(1.2rem, 4vw, 2rem);
  text-transform: uppercase;
  white-space: pre-wrap;
}
.deck {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  padding: 12px 14px 14px;
  background: var(--slab);
  border-top: var(--frame) solid var(--hair);
}
button {
  font: inherit;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
  padding: 10px 12px;
  color: #000;
  background: var(--acid);
  border: 0;
  border-radius: 0;
  cursor: pointer;
  text-align: left;
  transition: transform .2s ease, box-shadow .2s ease, background .2s, color .2s;
}
button small, button output { font-size: 10px; font-weight: 700; opacity: 0.7; font-variant-numeric: tabular-nums; }
button:hover {
  transform: translate(2px, -2px);
  box-shadow: -2px 2px 0 var(--ink);
}
button:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0;
}
button[aria-pressed="true"] {
  background: #000;
  color: var(--acid);
  box-shadow: inset 0 0 0 1px var(--acid);
}
button:focus-visible { outline: 2px solid var(--acid); outline-offset: 3px; }
.hint {
  grid-column: 1 / -1;
  margin: 0;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
  color: var(--mut);
}
@media (max-width: 640px) {
  .spec { text-align: left; }
  .deck { gap: 8px; padding: 10px 10px 12px; }
  button { flex-direction: column; align-items: flex-start; gap: 2px; padding: 7px 8px; font-size: 10px; letter-spacing: 0.02em; }
  button small, button output { font-size: 9px; }
  .hint { font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  button { transition: none; }
  button:active { transform: none; }
}
</style>

<main class="app">
  <header>
    <div class="bar">
      <h1>Slab<span>/</span>Field</h1>
      <p class="spec">32 × 32 concrete columns<br>Wave solver + raymarched in WebGL</p>
    </div>
    <div class="hazard" aria-hidden="true"></div>
  </header>

  <section class="stage" aria-label="Interactive 3D concrete field">
    <canvas id="gl" role="img" aria-label="A pit of concrete columns that rise and fall in waves. Click to send a shockwave."></canvas>
    <p class="tag tl" id="toolTag">Tool <b>Pulse</b></p>
    <p class="tag bl" id="status">Field idle</p>
    <p class="tag br"><span>CELL <b id="cell">--</b></span><span>MASS <b id="mass">----</b> T</span><span>FPS <b id="fps">--</b> · <b id="res">--</b></span></p>
    <div class="nogl" id="nogl" hidden></div>
  </section>

  <footer class="deck">
    <button type="button" id="t0" data-tool="0" aria-pressed="true"><span>Pulse</span><small>1</small></button>
    <button type="button" id="t1" data-tool="1" aria-pressed="false"><span>Raise</span><small>2</small></button>
    <button type="button" id="t2" data-tool="2" aria-pressed="false"><span>Carve</span><small>3</small></button>
    <button type="button" id="bReset"><span>Reset</span><small>R</small></button>
    <button type="button" id="bSound" aria-pressed="false"><span>Sound</span><output id="soundState">Off</output></button>
    <button type="button" id="bDither" aria-pressed="true"><span>Dither</span><output id="ditherState">On</output></button>
    <button type="button" id="bScale"><span>Detail</span><output id="scaleState">0.6×</output></button>
    <button type="button" id="bSpin" aria-pressed="true"><span>Spin</span><output id="spinState">On</output></button>
    <p class="hint">Pulse: click for a shockwave, drag to orbit. Raise / Carve: hold to sculpt, right-drag to orbit. Wheel zooms. Keys 1 2 3, Space, R.</p>
  </footer>
</main>

<script>
(function () {
  var N = 32, HALF = 16, HMAX = 9, FOCAL = 1.8;

  var VERT = "attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}";

  var FRAG = [
"precision highp float;",
"uniform vec2 uRes;",
"uniform float uTime;",
"uniform vec3 uRo;",
"uniform vec3 uFw;",
"uniform vec3 uRt;",
"uniform vec3 uUp;",
"uniform sampler2D uField;",
"uniform vec3 uCursor;",
"uniform float uTool;",
"uniform float uGlitch;",
"uniform float uDither;",
"uniform vec3 uSignal;",
"const float N = 32.0;",
"const float HALF = 16.0;",
"const float HW = 0.43;",
"const float HMAX = 9.0;",
"const vec3 FOG = vec3(0.08, 0.09, 0.10);",

"float hash(vec2 p){",
"  p = fract(p * vec2(123.34, 456.21));",
"  p += dot(p, p + 45.32);",
"  return fract(p.x * p.y);",
"}",
"float vnoise(vec2 p){",
"  vec2 i = floor(p); vec2 f = fract(p);",
"  f = f * f * (3.0 - 2.0 * f);",
"  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),",
"             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);",
"}",
"vec2 fetch(vec2 cell){",
"  vec4 t = texture2D(uField, (cell + HALF + 0.5) / N);",
"  return vec2(floor(t.r * 255.0 / 7.0 + 0.5) * 0.25, t.a);",
"}",
"bool outside(vec2 c){ return c.x < -HALF || c.x >= HALF || c.y < -HALF || c.y >= HALF; }",

"float shadow(vec3 p, vec3 L){",
"  for(int i = 1; i <= 16; i++){",
"    vec3 q = p + L * (0.15 + float(i) * 0.4);",
"    if(q.y > HMAX) break;",
"    vec2 cell = floor(q.xz);",
"    if(outside(cell)) break;",
"    vec2 f = abs(fract(q.xz) - 0.5);",
"    if(max(f.x, f.y) < HW && q.y < fetch(cell).x) return 0.0;",
"  }",
"  return 1.0;",
"}",

"float b2(vec2 a){ a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }",
"float bayer4(vec2 a){ return b2(0.5 * a) * 0.25 + b2(a); }",

"void main(){",
"  vec2 fc = gl_FragCoord.xy;",
"  vec2 uv = (fc * 2.0 - uRes) / uRes.y;",
"  float row = floor(fc.y / (uRes.y / 22.0));",
"  float tick = floor(uTime * 14.0);",
"  float gh = hash(vec2(row, tick));",
"  float band = step(1.0 - uGlitch * 0.4, gh);",
"  uv.x += band * (hash(vec2(row, tick + 9.0)) - 0.5) * 0.4 * uGlitch;",

"  vec3 rd = normalize(uv.x * uRt + uv.y * uUp + 1.8 * uFw);",
"  rd = mix(rd, vec3(0.00001), step(abs(rd), vec3(0.00001)));",
"  vec3 L = normalize(vec3(-0.45, 0.8, -0.35));",

"  vec3 t1 = (vec3(-HALF, 0.0, -HALF) - uRo) / rd;",
"  vec3 t2 = (vec3(HALF, HMAX, HALF) - uRo) / rd;",
"  vec3 tmn = min(t1, t2); vec3 tmx = max(t1, t2);",
"  float tEn = max(max(tmn.x, tmn.y), max(tmn.z, 0.0));",
"  float tEx = min(min(tmx.x, tmx.y), tmx.z);",

"  int kind = 0; float tHit = 0.0; vec3 nrm = vec3(0.0, 1.0, 0.0);",
"  vec2 cellHit = vec2(0.0); float hCell = 0.0; float glow = 0.0;",

"  if(tEn < tEx){",
"    vec3 ps = uRo + rd * (tEn + 0.0001);",
"    vec2 cell = floor(ps.xz);",
"    vec2 stp = sign(rd.xz);",
"    vec2 tD = abs(1.0 / rd.xz);",
"    vec2 tM = tEn + ((cell + step(0.0, stp)) - ps.xz) / rd.xz;",
"    float tc = tEn;",
"    for(int i = 0; i < 110; i++){",
"      if(outside(cell)) break;",
"      float tOut = min(min(tM.x, tM.y), tEx);",
"      vec2 hg = fetch(cell);",
"      float h = hg.x;",
"      if(h > 0.01){",
"        vec3 bmin = vec3(cell.x + 0.5 - HW, 0.0, cell.y + 0.5 - HW);",
"        vec3 bmax = vec3(cell.x + 0.5 + HW, h, cell.y + 0.5 + HW);",
"        vec3 a = (bmin - uRo) / rd; vec3 b = (bmax - uRo) / rd;",
"        vec3 mn = min(a, b); vec3 mx = max(a, b);",
"        float tn = max(max(mn.x, mn.y), mn.z);",
"        float tf = min(min(mx.x, mx.y), mx.z);",
"        if(tn < tf && tf > tc){",
"          tHit = max(tn, 0.0);",
"          nrm = -sign(rd) * step(mn.yzx, mn.xyz) * step(mn.zxy, mn.xyz);",
"          kind = 1; cellHit = cell; hCell = h; glow = hg.y;",
"          break;",
"        }",
"      }",
"      if(rd.y < 0.0){",
"        float tg = -uRo.y / rd.y;",
"        if(tg >= tc - 0.001 && tg <= tOut + 0.001){ kind = 2; tHit = tg; break; }",
"      }",
"      if(tOut >= tEx) break;",
"      if(tM.x < tM.y){ cell.x += stp.x; tc = tM.x; tM.x += tD.x; }",
"      else { cell.y += stp.y; tc = tM.y; tM.y += tD.y; }",
"    }",
"  }",
"  if(kind == 0 && rd.y < 0.0){ kind = 3; tHit = -uRo.y / rd.y; }",

"  vec3 col;",
"  if(kind == 0){",
"    col = mix(FOG, vec3(0.02, 0.03, 0.04), smoothstep(0.0, 0.7, rd.y));",
"  } else {",
"    vec3 p = uRo + rd * tHit;",
"    float ringD = length(p.xz - uCursor.xy);",
"    float ring = exp(-pow((ringD - 2.3) * 5.0, 2.0)) * uCursor.z;",
"    if(kind == 1){",
"      vec3 n = nrm;",
"      float top = step(0.5, n.y);",
"      vec3 loc = p - vec3(cellHit.x + 0.5, 0.0, cellHit.y + 0.5);",
"      float rnd = hash(cellHit);",
"      vec2 su = top > 0.5 ? loc.xz : vec2(loc.x + loc.z, p.y);",
"      float grain = vnoise(su * 9.0 + rnd * 50.0) * 0.5 + vnoise(su * 31.0) * 0.5;",
"      vec3 alb = vec3(0.38, 0.39, 0.40) * (0.62 + 0.55 * grain) * (0.88 + 0.24 * rnd);",
"      float seam = 1.0 - smoothstep(0.0, 0.02, abs(fract(p.y * 2.0 + 0.5) - 0.5) * 0.5);",
"      alb *= 1.0 - 0.45 * seam * (1.0 - top);",
"      float de = HW - max(abs(loc.x), abs(loc.z));",
"      float edgeTop = (1.0 - smoothstep(0.0, 0.035, de)) * top;",
"      alb += 0.10 * edgeTop;",
"      alb *= 0.85 + 0.04 * hCell;",
"      vec2 cc = vec2(cellHit.x + 0.5, cellHit.y + 0.5);",
"      float dc = length(cc - uCursor.xy);",
"      float inBrush = step(dc, 2.3) * uCursor.z;",
"      float isCur = step(dc, 0.6) * uCursor.z;",
"      vec3 curCol = uTool > 1.5 ? vec3(0.02) : uSignal * 0.9;",
"      alb = mix(alb, curCol, isCur * top * 0.92);",
"      float sideGlow = smoothstep(hCell - 1.2, hCell, p.y);",
"      vec3 emis = uSignal * glow * 1.5 * mix(sideGlow, 1.0, top);",
"      emis += uSignal * edgeTop * inBrush * 1.6;",
"      float dif = max(dot(n, L), 0.0);",
"      float sh = shadow(p + n * 0.02, L);",
"      float ao = mix(mix(0.5, 1.0, smoothstep(0.0, 1.5, p.y)), 1.0, top);",
"      col = alb * ((0.32 + 0.2 * n.y) + 0.95 * dif * sh) * ao + emis;",
"    } else {",
"      bool inGrid = max(abs(p.x), abs(p.z)) < HALF;",
"      float dif = L.y;",
"      float sh = shadow(p + vec3(0.0, 0.02, 0.0), L);",
"      if(inGrid){",
"        vec2 f = abs(fract(p.xz + 0.5) - 0.5);",
"        float ln = 1.0 - smoothstep(0.0, 0.03, min(f.x, f.y));",
"        vec3 alb = vec3(0.04, 0.04, 0.05) + 0.10 * ln;",
"        col = alb * (0.55 + 0.9 * dif * sh);",
"      } else {",
"        float g = vnoise(p.xz * 2.0);",
"        vec3 alb = vec3(0.10, 0.11, 0.12) * (0.9 + 0.1 * g);",
"        vec2 f = abs(fract(p.xz * 0.25 + 0.5) - 0.5) * 4.0;",
"        alb *= 1.0 - 0.18 * (1.0 - smoothstep(0.0, 0.05 + tHit * 0.003, min(f.x, f.y)));",
"        float eD = max(abs(p.x), abs(p.z)) - HALF;",
"        float strip = step(0.0, eD) * step(eD, 1.0);",
"        float s = step(0.5, fract((p.x + p.z) * 0.6));",
"        alb = mix(alb, mix(vec3(0.02), uSignal, s), strip);",
"        col = alb * (0.62 + 0.45 * sh);",
"      }",
"      col += uSignal * ring * 0.9;",
"    }",
"    float fog = 1.0 - exp(-tHit * 0.011);",
"    col = mix(col, FOG, fog);",
"  }",

"  col *= 1.0 - 0.22 * dot(uv * 0.5, uv * 0.5);",
"  col = (col - 0.5) * 1.1 + 0.5;",
"  col *= 0.94 + 0.06 * sin(fc.y * 3.14159);",
"  col = mix(col, col.bgr, band);",
"  col = mix(col, 1.0 - col, band * step(0.85, hash(vec2(row + 3.0, tick))));",
"  float lv = 6.0;",
"  float bb = mix(0.5, bayer4(fc), uDither);",
"  col = floor(clamp(col, 0.0, 1.0) * lv + bb) / lv;",
"  gl_FragColor = vec4(col, 1.0);",
"}"
  ].join("\n");

  var canvas = document.getElementById("gl");
  var nogl = document.getElementById("nogl");
  function fail(msg) { nogl.hidden = false; nogl.textContent = msg; }

  var gl = null;
  try { gl = canvas.getContext("webgl", { antialias: false, powerPreference: "high-performance" }); } catch (e) {}
  if (!gl) { fail("WebGL unavailable\nOpen this page in a browser with WebGL enabled."); return; }

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      var log = gl.getShaderInfoLog(s) || "unknown";
      fail("Shader error\n" + log.slice(0, 300));
      throw new Error(log);
    }
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { fail("Link error\n" + (gl.getProgramInfoLog(prog) || "").slice(0, 300)); return; }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var U = {};
  ["uRes", "uTime", "uRo", "uFw", "uRt", "uUp", "uField", "uCursor", "uTool", "uGlitch", "uDither", "uSignal"].forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });

  var texData = new Uint8Array(N * N * 2);
  var tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE_ALPHA, N, N, 0, gl.LUMINANCE_ALPHA, gl.UNSIGNED_BYTE, texData);
  gl.uniform1i(U.uField, 0);

  var rest = new Float32Array(N * N);
  var disp = new Float32Array(N * N);
  var vel = new Float32Array(N * N);
  var heat = new Float32Array(N * N);

  function rnd(i, j) { var s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }
  function vn(x, y) {
    var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    var sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    var a = rnd(ix, iy), b = rnd(ix + 1, iy), c = rnd(ix, iy + 1), d = rnd(ix + 1, iy + 1);
    return (a + (b - a) * sx) + ((c + (d - c) * sx) - (a + (b - a) * sx)) * sy;
  }
  function resetField() {
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var i = y * N + x;
      var n = vn(x * 0.22 + 3, y * 0.22) * 0.65 + vn(x * 0.55, y * 0.55 + 7) * 0.35;
      rest[i] = Math.max(0, Math.min(8, 0.5 + 5 * Math.pow(n, 2.4)));
      disp[i] = 0; vel[i] = 0; heat[i] = 0;
    }
    [[15, 15], [16, 15], [15, 16], [16, 16]].forEach(function (c) { rest[c[1] * N + c[0]] = 8; });
  }
  resetField();

  function total(i) { return Math.max(0, Math.min(HMAX, rest[i] + disp[i])); }
  function heightAt(wx, wz) {
    var x = Math.floor(wx) + HALF, y = Math.floor(wz) + HALF;
    if (x < 0 || y < 0 || x >= N || y >= N) return 0;
    return Math.round(total(y * N + x) * 4) / 4;
  }

  var K = 0.12, DAMP = 0.988;
  function physics() {
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var i = y * N + x;
      var l = x > 0 ? disp[i - 1] : 0, r = x < N - 1 ? disp[i + 1] : 0;
      var u = y > 0 ? disp[i - N] : 0, d = y < N - 1 ? disp[i + N] : 0;
      vel[i] = (vel[i] + K * (l + r + u + d - 4 * disp[i]) - 0.002 * disp[i]) * DAMP;
    }
    for (var j = 0; j < N * N; j++) { disp[j] += vel[j]; heat[j] *= 0.93; }
  }
  function upload() {
    for (var i = 0; i < N * N; i++) {
      var steps = Math.min(36, Math.round(total(i) * 4));
      texData[i * 2] = steps * 7;
      texData[i * 2 + 1] = Math.min(255, Math.round(Math.abs(vel[i]) * 170 + heat[i] * 255));
    }
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, N, N, gl.LUMINANCE_ALPHA, gl.UNSIGNED_BYTE, texData);
  }

  var signalColor = [0.753, 0.996, 0.016];
  function readSignal(){
    var s = (getComputedStyle(document.documentElement).getPropertyValue('--acid') || '').trim();
    if (s.charAt(0) === '#') {
      if (s.length === 4) s = '#' + s[1]+s[1]+s[2]+s[2]+s[3]+s[3];
      if (s.length === 7) {
        signalColor = [
          parseInt(s.slice(1,3),16)/255,
          parseInt(s.slice(3,5),16)/255,
          parseInt(s.slice(5,7),16)/255
        ];
      }
    }
  }
  readSignal();

  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var tool = 0;
  var dither = 1, spin = reduce ? 0 : 1;
  var scales = [0.4, 0.6, 1.0], scaleI = 1;
  var cam = { yaw: 0.7, pitch: 0.62, dist: 34 };
  var burst = 0, shake = 0;
  var cursor = { x: 0, z: 0, on: 0 };
  var lastInput = performance.now();
  var autoT = 0;
  var cam3 = { ro: [0, 0, 0], fw: [0, 0, 1], rt: [1, 0, 0], up: [0, 1, 0] };

  var elTool = document.getElementById("toolTag");
  var elStatus = document.getElementById("status");
  var elCell = document.getElementById("cell");
  var elMass = document.getElementById("mass");
  var elFps = document.getElementById("fps");
  var elRes = document.getElementById("res");
  var toolNames = ["Pulse", "Raise", "Carve"];

  function norm(v) { var l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }

  function updateCamera() {
    var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    var tgt = [0, 1.5, 0];
    var ro = [tgt[0] + cam.dist * cp * Math.sin(cam.yaw), tgt[1] + cam.dist * sp, tgt[2] + cam.dist * cp * Math.cos(cam.yaw)];
    var fw = norm([tgt[0] - ro[0], tgt[1] - ro[1], tgt[2] - ro[2]]);
    var rt = norm(cross([0, 1, 0], fw));
    var up = cross(fw, rt);
    if (shake > 0.001) {
      ro[0] += (Math.random() - 0.5) * shake * 0.5;
      ro[1] += (Math.random() - 0.5) * shake * 0.5;
      ro[2] += (Math.random() - 0.5) * shake * 0.5;
    }
    cam3 = { ro: ro, fw: fw, rt: rt, up: up };
  }

  function pick(px, py) {
    var r = canvas.getBoundingClientRect();
    var u = (2 * px / r.width - 1) * (r.width / r.height);
    var v = 1 - 2 * py / r.height;
    var c = cam3;
    var rd = norm([u * c.rt[0] + v * c.up[0] + FOCAL * c.fw[0], u * c.rt[1] + v * c.up[1] + FOCAL * c.fw[1], u * c.rt[2] + v * c.up[2] + FOCAL * c.fw[2]]);
    if (rd[1] > -0.0001) return null;
    var y = 0, x = 0, z = 0;
    for (var k = 0; k < 4; k++) {
      var t = (y - c.ro[1]) / rd[1];
      x = c.ro[0] + rd[0] * t; z = c.ro[2] + rd[2] * t;
      y = heightAt(x, z);
    }
    if (Math.abs(x) >= HALF || Math.abs(z) >= HALF) return null;
    return [x, z];
  }

  var actx = null, soundOn = false;
  function thud(power) {
    if (!soundOn || !actx) return;
    var t = actx.currentTime;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(115, t);
    o.frequency.exponentialRampToValueAtTime(30, t + 0.4);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.6 * power, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + 0.6);
    var len = Math.floor(actx.sampleRate * 0.14);
    var nb = actx.createBuffer(1, len, actx.sampleRate);
    var d = nb.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var ns = actx.createBufferSource(); ns.buffer = nb;
    var lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 520;
    var ng = actx.createGain(); ng.gain.value = 0.35 * power;
    ns.connect(lp); lp.connect(ng); ng.connect(actx.destination);
    ns.start(t);
  }

  function pulse(wx, wz, strength) {
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var dx = x - HALF + 0.5 - wx, dz = y - HALF + 0.5 - wz;
      var d2 = dx * dx + dz * dz;
      if (d2 < 16) vel[y * N + x] += strength * Math.exp(-d2 / 1.8);
    }
    burst = Math.min(1, burst + 0.6);
    shake = Math.min(1, shake + 0.7);
    elStatus.textContent = "Shockwave";
    thud(Math.min(1, strength / 1.6));
  }

  function sculpt(wx, wz, sign, dt) {
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var dx = x - HALF + 0.5 - wx, dz = y - HALF + 0.5 - wz;
      var d2 = dx * dx + dz * dz;
      if (d2 < 9) {
        var i = y * N + x;
        var f = Math.exp(-d2 / 2.2);
        rest[i] = Math.max(0, Math.min(HMAX, rest[i] + sign * 4.5 * dt * f));
        heat[i] = Math.max(heat[i], 0.8 * f);
      }
    }
  }

  var pressed = false, dragging = false, pbtn = 0, sx = 0, sy = 0, lx = 0, ly = 0, mx = 0, my = 0, inside = false, shiftHeld = false;
  function touched() { lastInput = performance.now(); }
  function setMouse(e) { var r = canvas.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; }

  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  canvas.addEventListener("pointerdown", function (e) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    pressed = true; dragging = false; pbtn = e.button; shiftHeld = e.shiftKey;
    sx = lx = e.clientX; sy = ly = e.clientY; inside = true;
    setMouse(e); touched();
  });
  canvas.addEventListener("pointermove", function (e) {
    setMouse(e); inside = true; touched();
    if (!pressed) return;
    var orbitMode = pbtn === 2 || shiftHeld || tool === 0;
    if (orbitMode) {
      if (!dragging && Math.hypot(e.clientX - sx, e.clientY - sy) > 6) dragging = true;
      if (dragging) {
        cam.yaw -= (e.clientX - lx) * 0.006;
        cam.pitch = Math.max(0.2, Math.min(1.45, cam.pitch + (e.clientY - ly) * 0.005));
      }
    }
    lx = e.clientX; ly = e.clientY;
  });
  function endPress(e) {
    if (pressed && !dragging && tool === 0 && pbtn === 0 && !shiftHeld) {
      var p = pick(mx, my);
      pulse(p ? p[0] : 0, p ? p[1] : 0, 1.6);
    }
    pressed = false; dragging = false;
    if (e && e.pointerType === "touch") inside = false;
  }
  canvas.addEventListener("pointerup", endPress);
  canvas.addEventListener("pointercancel", function () { pressed = false; dragging = false; inside = false; });
  canvas.addEventListener("pointerleave", function (e) { if (e.pointerType !== "touch") inside = false; });
  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    cam.dist = Math.max(14, Math.min(60, cam.dist * Math.exp(e.deltaY * 0.001)));
    touched();
  }, { passive: false });

  function setTool(n) {
    tool = n;
    for (var i = 0; i < 3; i++) document.getElementById("t" + i).setAttribute("aria-pressed", i === n ? "true" : "false");
    elTool.innerHTML = "Tool <b>" + toolNames[n] + "</b>";
  }
  [0, 1, 2].forEach(function (i) { document.getElementById("t" + i).addEventListener("click", function () { setTool(i); touched(); }); });
  document.getElementById("bReset").addEventListener("click", function () { resetField(); elStatus.textContent = "Field reset"; touched(); });

  var bSound = document.getElementById("bSound");
  bSound.addEventListener("click", function () {
    soundOn = !soundOn;
    if (soundOn && !actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      try { actx = new AC(); } catch (e) { soundOn = false; }
    }
    if (soundOn && actx && actx.resume) actx.resume();
    bSound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    document.getElementById("soundState").textContent = soundOn ? "On" : "Off";
    if (soundOn) thud(0.8);
    touched();
  });
  var bDither = document.getElementById("bDither");
  bDither.addEventListener("click", function () {
    dither = dither ? 0 : 1;
    bDither.setAttribute("aria-pressed", dither ? "true" : "false");
    document.getElementById("ditherState").textContent = dither ? "On" : "Off";
  });
  var bSpin = document.getElementById("bSpin");
  function showSpin() {
    bSpin.setAttribute("aria-pressed", spin ? "true" : "false");
    document.getElementById("spinState").textContent = spin ? "On" : "Off";
  }
  bSpin.addEventListener("click", function () { spin = spin ? 0 : 1; showSpin(); });
  showSpin();
  document.getElementById("bScale").addEventListener("click", function () {
    scaleI = (scaleI + 1) % scales.length;
    document.getElementById("scaleState").textContent = scales[scaleI] + "×";
    resize();
  });
  window.addEventListener("keydown", function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === "1") setTool(0);
    else if (e.key === "2") setTool(1);
    else if (e.key === "3") setTool(2);
    else if (e.key === "r" || e.key === "R") { resetField(); elStatus.textContent = "Field reset"; }
    else if (e.key === " ") {
      e.preventDefault();
      var p = cursor.on ? [cursor.x, cursor.z] : [0, 0];
      pulse(p[0], p[1], 1.6);
    } else return;
    touched();
  });

  function resize() {
    var r = canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var w = Math.max(2, Math.round(r.width * dpr * scales[scaleI]));
    var h = Math.max(2, Math.round(r.height * dpr * scales[scaleI]));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
      elRes.textContent = w + "×" + h;
    }
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas.parentNode);
  window.addEventListener("resize", resize);

  var last = performance.now(), t0 = last;
  var simAcc = 0, fAcc = 0, frames = 0, hudT = 0;

  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    var time = (now - t0) / 1000;
    var idle = now - lastInput > 8000;

    if (spin && !pressed) cam.yaw += dt * (idle ? 0.09 : 0.05);
    burst = Math.max(0, burst - dt * 1.6);
    shake = Math.max(0, shake - dt * 3.0);
    updateCamera();

    var p = (inside || pressed) && !dragging ? pick(mx, my) : null;
    if (p) { cursor.x = p[0]; cursor.z = p[1]; cursor.on = 1; } else cursor.on = 0;

    if (cursor.on && pressed && !dragging && pbtn === 0 && !shiftHeld) {
      if (tool === 1) sculpt(cursor.x, cursor.z, 1, dt);
      else if (tool === 2) sculpt(cursor.x, cursor.z, -1, dt);
    }

    if (idle && !reduce) {
      autoT -= dt;
      if (autoT <= 0) { pulse((Math.random() * 2 - 1) * 11, (Math.random() * 2 - 1) * 11, 1.3); autoT = 1.2 + Math.random() * 1.4; }
    }

    simAcc += dt;
    var guard = 0;
    while (simAcc >= 1 / 60 && guard < 3) { physics(); simAcc -= 1 / 60; guard++; }
    if (simAcc > 0.1) simAcc = 0;
    upload();

    var c = cam3;
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, time);
    gl.uniform3f(U.uRo, c.ro[0], c.ro[1], c.ro[2]);
    gl.uniform3f(U.uFw, c.fw[0], c.fw[1], c.fw[2]);
    gl.uniform3f(U.uRt, c.rt[0], c.rt[1], c.rt[2]);
    gl.uniform3f(U.uUp, c.up[0], c.up[1], c.up[2]);
    gl.uniform3f(U.uCursor, cursor.x, cursor.z, cursor.on);
    gl.uniform1f(U.uTool, tool);
    gl.uniform1f(U.uGlitch, burst * burst);
    gl.uniform1f(U.uDither, dither);
    gl.uniform3f(U.uSignal, signalColor[0], signalColor[1], signalColor[2]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    fAcc += dt; frames++; hudT += dt;
    if (hudT > 0.25) {
      elFps.textContent = Math.round(frames / fAcc);
      fAcc = 0; frames = 0; hudT = 0;
      var m = 0;
      for (var i = 0; i < N * N; i++) m += Math.round(total(i) * 4) / 4;
      elMass.textContent = Math.round(m * 0.74 * 2.4).toLocaleString("en-US");
      if (cursor.on) {
        var cx = Math.floor(cursor.x), cz = Math.floor(cursor.z);
        elCell.textContent = (cx >= 0 ? "+" : "-") + String(Math.abs(cx)).padStart(2, "0") + " " + (cz >= 0 ? "+" : "-") + String(Math.abs(cz)).padStart(2, "0") + " H" + heightAt(cursor.x, cursor.z).toFixed(2);
      } else elCell.textContent = "--";
      if (burst < 0.05 && !pressed) elStatus.textContent = idle ? "Demo running" : "Field idle";
      else if (pressed && cursor.on && tool > 0) elStatus.textContent = tool === 1 ? "Pouring" : "Carving";
    }
    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>

<script>
window.addEventListener('message', function(e){
  if (e.origin === location.origin && e.source === window.parent &&
      e.data && e.data.type === 'acid' && /^#[0-9a-f]{6}$/i.test(e.data.value)) {
    document.documentElement.style.setProperty('--acid', e.data.value);
  }
});
</script>

</body></html>
